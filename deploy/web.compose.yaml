services:
  web:
    image: nginx:1.30.6-alpine-slim@sha256:3028fc1419f99b95c1c69f844bbaf49dc1b881750c51b497fc721ac4f02a14e6
    user: '101:101'
    entrypoint: [nginx]
    command: [-c, /etc/nginx/nginx.conf, -g, 'daemon off;']
    ports:
      - '80:8080'
      - '443:8444'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../tls:/tls:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, nginx, -t, -c, /etc/nginx/nginx.conf]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=4m,mode=1777
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
