name: family-rewards
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: family-rewards:0.1.0
    env_file: ../.env
    environment:
      DATABASE_URL: file:/data/family.db
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ../data:/data
      - ../uploads:/app/uploads:ro
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
